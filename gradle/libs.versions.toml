[versions]
agp = "9.2.1"
kotlin = "2.4.0"
ksp = "2.3.9"
googleServices = "4.4.4"
crashlytics = "3.0.7"
hilt = "2.59.2"
coreKtx = "1.19.0"
appcompat = "1.7.1"
material = "1.14.0"
constraintlayout = "2.2.1"
kotlinxCoroutines = "1.11.0"
kotlinxProtobuf = "1.11.0"
datastore = "1.2.1"
lifecycle = "2.10.0"
firebaseBom = "34.14.1"
navigation = "2.9.8"
work = "2.11.2"
hiltCompiler = "1.3.0"
playServicesAds = "25.3.0"
espressoCore = "3.7.0"
#compose
compose-bom = "2026.05.01"

#tests
junit6-plugin = "2.0.1"
junit6 = "6.1.0"
junit6-android = "2.0.1"
mockk = "1.14.11"
kotest = "6.1.11"
coroutines-test = "1.11.0"
turbine = "1.2.1"

[libraries]
#android
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-datastore = { group = "androidx.datastore", name = "datastore", version.ref = "datastore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-livedata-ktx = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigation" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
#compose
compose-buildscript = { group = "org.jetbrains.kotlin.plugin.compose", name = "org.jetbrains.kotlin.plugin.compose.gradle.plugin", version.ref = "kotlin" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-runtime = { group = "androidx.compose.runtime", name = "runtime" } #core runtime for compose
compose-runtime-livedata = { group = "androidx.compose.runtime", name = "runtime-livedata" } #integration with LiveData
compose-ui = { group = "androidx.compose.ui", name = "ui" } #preview support
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" } #preview support
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" } #basic components like Row, Column, Box, etc.
compose-foundation-layout = { group = "androidx.compose.foundation", name = "foundation-layout" } #components that require additional dependencies, such as LazyColumn, LazyRow, etc.
compose-material3 = { group = "androidx.compose.material3", name = "material3" } #Material Design 3 components
compose-navigation = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" } #compose naviation
compose-hilt-navigation = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltCompiler" } #compose naviation with hilt
#ads
play-services-ads = { group = "com.google.android.gms", name = "play-services-ads", version.ref = "playServicesAds" }
#kotlin
kotlin-metadata-jvm = { group = "org.jetbrains.kotlin", name = "kotlin-metadata-jvm", version.ref = "kotlin" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-protobuf = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-protobuf", version.ref = "kotlinxProtobuf" }
#firebase
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }
#hilt
androidx-hilt-common = { group = "androidx.hilt", name = "hilt-common", version.ref = "hiltCompiler" }
androidx-hilt-navigation-fragment = { group = "androidx.hilt", name = "hilt-navigation-fragment", version.ref = "hiltCompiler" }
androidx-hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "hiltCompiler" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-android-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hiltCompiler" }
#testing
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-test-espresso-intents = { group = "androidx.test.espresso", name = "espresso-intents", version.ref = "espressoCore" }
junit6-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit6" }
junit6-api = { group = "org.junit.jupiter", name = "junit-jupiter-api" }
junit6-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine" }
junit6-android-core = { group = "de.mannodermaus.junit5", name = "android-test-core-junit6", version.ref = "junit6-android" }
junit6-android-runner = { group = "de.mannodermaus.junit5", name = "android-test-runner-junit6", version.ref = "junit6-android" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
kotest-assertions-core = { group = "io.kotest", name = "kotest-assertions-core", version.ref = "kotest" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines-test" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
google-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
google-hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "crashlytics" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-junit6 = { id = "de.mannodermaus.android-junit5", version.ref = "junit6-plugin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }